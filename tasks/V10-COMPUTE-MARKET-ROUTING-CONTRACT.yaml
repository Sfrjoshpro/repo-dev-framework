id: V10-COMPUTE-MARKET-ROUTING-CONTRACT
title: Define compute market and routing contract
status: validating

goal: >-
  Define the durable provider-agnostic contract for minimizing verified development cost
  across deterministic tools, local compute, subscriptions where automatable, and metered
  model APIs while preserving user-selected quality, time, risk, and budget constraints.

why: >-
  Context efficiency alone does not minimize total development cost. The framework needs a
  durable contract for current market data, provider/model capability metadata, cost accounting,
  routing, escalation, benchmarking, and user-owned policy before any provider integration is built.

required_context:
  - AGENTS.md
  - docs/development/CONTEXT_POLICY.md
  - development-state/ACTIVE_WORK.yaml
  - development-state/ACTIVE_CONTEXT.yaml

allowed_paths:
  - tasks/V10-COMPUTE-MARKET-ROUTING-CONTRACT.yaml
  - development-state/CURRENT_STATE.yaml
  - development-state/ACTIVE_WORK.yaml
  - development-state/ACTIVE_CONTEXT.yaml
  - development-state/handoffs/V10-COMPUTE-MARKET-ROUTING-CONTRACT.yaml
  - docs/architecture/COMPUTE_MARKET_ROUTING.md

non_goals:
  - implementing provider API clients
  - storing API keys or credentials
  - hard-coding a permanent model winner
  - scraping provider sites in CI
  - implementing automatic model switching
  - implementing billing or payment systems
  - claiming subscription capacity can be automated where no supported interface exists
  - measuring hidden model reasoning tokens or hidden application context
  - changing project-model semantics
  - unrelated framework cleanup

dependencies: []
unknowns: []
decision_refs: []

validation:
  - Framework Check passes with active V10 context/state
  - V10 task contract directly satisfies task-guard readiness fields: valid status, nonempty allowed_paths, nonempty validation, no unknowns
  - pull-request Framework Check enforces branch-base ACTIVE_WORK allowed_paths
  - review final diff against allowed_paths

completion:
  implementation_complete: true
  validation_passed: true
  diff_reviewed: true
  state_updated: false
  blocking_unknowns_resolved: true
  checkpoint_recorded: false

handoff_notes:
  - V10 captures the compute-market vision as design truth before implementation.
  - The optimization target is verified useful work, not cheapest token price.
  - Provider/model identities are replaceable market data; workflow policy remains user-owned.
  - GitHub connector execution cannot invoke the literal local task-specific CLI command; Framework Check passed and the task-guard contract fields were directly inspected instead. Do not represent the literal command as executed.
